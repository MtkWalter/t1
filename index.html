<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>寓所 · 3D 空間漫遊</title><link rel="stylesheet" href="style.css"></head><body>
<div id="scene"></div><header><a class="brand" href="./">寓所<span>SPACE WALK / 01</span></a><div class="project">住宅空間重建<span>依提供的電氣平面圖繪製 · 比例示意</span></div><span class="live">● 即時 3D</span></header>
<aside class="panel"><span class="eyebrow">YOUR SPACE, EXPLORED</span><h1>走進你的<br>理想空間。</h1><p>從平面到立體，用不同的角度<br>重新認識家的每一個角落。</p><div class="rule"></div><div class="stat"><span>室內參考尺度</span><b>7.55 × 6.90 <small>m</small></b></div><div class="stat"><span>目前視角</span><b id="modeLabel">空間總覽</b></div><button id="enter" class="primary">進入空間漫遊 <span>↗</span></button><button id="overview" class="secondary">⌘ 返回俯視總覽</button><div class="toggle"><label for="electric">顯示電源插座</label><input type="checkbox" id="electric" checked></div><p class="note">牆高、門窗及家具依圖面估算。<br>本模型供空間體驗，非施工圖。</p></aside>
<div class="map"><div class="map-title">空間導覽 <span>N ↑</span></div><canvas id="minimap" width="220" height="200"></canvas><div class="legend"><i></i> 您的位置 <span>│</span> 房間格局</div></div>
<div class="room" id="room">全屋總覽</div><footer><div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><span>或方向鍵移動</span><kbd>滑鼠拖曳</kbd><span>轉動視線</span><kbd>Esc</kbd><span>釋放滑鼠</span></div><button id="reset">↺ 重設位置</button></footer>
<div id="hint">點擊「進入空間漫遊」，從大門開始探索</div><div id="crosshair">+</div><div id="error" hidden></div><script type="module" src="app.js"></script></body></html>
